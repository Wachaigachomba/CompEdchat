{% extends "wachai/base.html" %}
{% load crispy_forms_tags %}
{% block content %}
<div class="full-screen d-flex align-items-center justify-content-center">
    <div class="card shadow-sm rounded form-container">
        <div class="card-body">
            <h2 class="card-title text-center mb-3">Reset Password</h2>
            <p class="card-text text-center">Enter your registered phone number to receive a reset code.</p>
            <form method="POST" class="p-3">
                {% csrf_token %}
                {{ form|crispy }}
                <button type="submit" class="btn btn-primary btn-block btn-sm mt-3">Send Code</button>
            </form>
            {% if messages %}
            <div class="mt-3">
                {% for message in messages %}
                <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                {% endfor %}
            </div>
            {% endif %}
        </div>
    </div>
</div>

<!-- Custom CSS -->
<style>
    .full-screen {
        height: 100vh;
        background-color: #e6f0fa;
        /* Light bluish background */
    }

    .form-container {
        width: 100%;
        max-width: 400px;
        background: white;
        border: 1px solid #e0e0e0;
        padding: 20px;
        border-radius: 12px;
    }
</style>
{% endblock %}
