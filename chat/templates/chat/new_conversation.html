{% extends "wachai/base.html" %}
{% block content %}
<div class="container mt-5">
    <h2 class="mb-4">Start a New Conversation</h2>
    <ul class="list-group">
        {% for user in users %}
        <li class="list-group-item d-flex justify-content-between align-items-center">
            {{ user.username }} ({{ user.email }})
            <a href="{% url 'chat:initiate_chat' user_id=user.id %}" class="btn btn-primary btn-sm">
                <i class="fas fa-comments"></i> Chat
            </a>
        </li>
        {% empty %}
        <li class="list-group-item">No other users available.</li>
        {% endfor %}
    </ul>
</div>
{% endblock %}
