{% extends "wachai/base.html" %}

{% block content %}
    <h2 class="text-center">Calendar - {{ month }}/{{ year }}</h2>

    <div class="calendar-container">
        {{ calendar|safe }}  <!-- Display the calendar -->
    </div>

    <br>

    <!-- Navigation Links for Previous & Next Month -->
    <div class="d-flex justify-content-between">
        <a href="{% url 'calendar' year month|add:'-1' %}" class="btn btn-secondary">Previous Month</a>
        <a href="{% url 'calendar' year month|add:'1' %}" class="btn btn-secondary">Next Month</a>
    </div>
{% endblock %}

<style>
    .calendar-container {
        border: 1px solid #ddd;
        padding: 15px;
        overflow-x: auto;
        background-color: #f8f9fa;
        border-radius: 10px;
        box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.1);
    }

    table {
        width: 100%;
        border-collapse: collapse;
        text-align: center;
    }

    th, td {
        padding: 15px;
        border: 1px solid #ddd;
        min-width: 100px;
        font-size: 16px;
    }

    th {
        background-color: #007bff;
        color: white;
    }

    td {
        background-color: #ffffff;
    }

    td:hover {
        background-color: #f1f1f1;
    }
</style>
